<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="628" viewBox="0 0 1080 628"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="628" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">发布内容与版本管理</text><text x="30" y="102" font-size="17" fill="#63738c">用户操作</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">填写发布内容与预览</text><text x="46" y="179" font-size="16" fill="#55657a">B / C 同契约，非像素级同组件</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">保存草稿或确认发布</text><text x="393" y="179" font-size="16" fill="#55657a">草稿不影响已有正式版</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">放弃 / 取消 / 重发</text><text x="740" y="179" font-size="16" fill="#55657a">操作语义不同</text><text x="30" y="247" font-size="17" fill="#63738c">版本状态</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">首次草稿 V0</text><text x="46" y="324" font-size="16" fill="#55657a">无正式版；可放弃保留编号</text><path d="M342,303 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">确认发布 V1…Vn</text><text x="393" y="324" font-size="16" fill="#55657a">插入快照、切换指针、清草稿</text><path d="M689,303 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">发布后另存草稿</text><text x="740" y="324" font-size="16" fill="#55657a">正式仍 Vn；再发才 Vn+1</text><text x="30" y="392" font-size="17" fill="#63738c">退出编辑的分支（备选操作，不是执行顺序）</text><rect x="30" y="408" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="440" font-size="21" font-weight="600" fill="#1c304d">放弃草稿</text><text x="46" y="469" font-size="16" fill="#55657a">有正式版：恢复其编辑表单</text><rect x="377" y="408" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="440" font-size="21" font-weight="600" fill="#1c304d">取消发布</text><text x="393" y="469" font-size="16" fill="#55657a">保留草稿 / 历史；公开不可见</text><rect x="724" y="408" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="440" font-size="21" font-weight="600" fill="#1c304d">再次发布</text><text x="740" y="469" font-size="16" fill="#55657a">复用任务号；新增正式版本</text><text x="30" y="535" font-size="17" fill="#63738c">蓝：真实实现路径；灰：演示 / 内存交互；橙：未接入或关键限制。</text><text x="30" y="564" font-size="17" fill="#63738c">依据：原报告 §4.8、§4.9；详见本模块末尾技术依据。</text></svg>