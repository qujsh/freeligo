<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="483" viewBox="0 0 1080 483"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="483" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">任务详情与项目展示</text><text x="30" y="102" font-size="17" fill="#63738c">用户操作</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">点击任务卡</text><text x="46" y="179" font-size="16" fill="#55657a">桌面抽屉；移动独立详情</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">查看 TASK 招募</text><text x="393" y="179" font-size="16" fill="#55657a">目标 / 报酬 / 交付 / 发布者</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">跳到 PROJECT 介绍</text><text x="740" y="179" font-size="16" fill="#55657a">查看冻结的项目树</text><text x="30" y="247" font-size="17" fill="#63738c">实体关系</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">内部 requirement</text><text x="46" y="324" font-size="16" fill="#55657a">关联拆解与工作项</text><path d="M342,303 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">一个 published_task</text><text x="393" y="324" font-size="16" fill="#55657a">当前版本指向正式快照</text><path d="M689,303 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">两种公开视角</text><text x="740" y="324" font-size="16" fill="#55657a">TASK 与派生 PROJECT 同源</text><text x="30" y="390" font-size="17" fill="#63738c">蓝：真实实现路径；灰：演示 / 内存交互；橙：未接入或关键限制。</text><text x="30" y="419" font-size="17" fill="#63738c">依据：原报告 §4.11；详见本模块末尾技术依据。</text></svg>