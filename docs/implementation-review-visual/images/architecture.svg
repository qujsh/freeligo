<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="628" viewBox="0 0 1080 628"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="628" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">系统架构｜两个前端，共享一个后端</text><text x="30" y="102" font-size="17" fill="#63738c">B 端真实读写</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">React 工作台</text><text x="46" y="179" font-size="16" fill="#55657a">登录、需求、拆解、发布</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">受保护 API</text><text x="393" y="179" font-size="16" fill="#55657a">Cookie + 身份 / 协作授权</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">MySQL + 本地文件</text><text x="740" y="179" font-size="16" fill="#55657a">业务数据 / 快照；媒体分开存储</text><text x="30" y="247" font-size="17" fill="#63738c">C 端真实浏览</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">Vue 网页</text><text x="46" y="324" font-size="16" fill="#55657a">分类、筛选、预览、详情</text><path d="M342,303 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">公开发现 API</text><text x="393" y="324" font-size="16" fill="#55657a">仅当前正式版；公开范围过滤</text><path d="M689,303 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">当前正式快照读模型</text><text x="740" y="324" font-size="16" fill="#55657a">关联实时账号 / 分类信息</text><text x="30" y="392" font-size="17" fill="#63738c">C 端演示支路</text><rect x="30" y="408" width="305" height="80" rx="12" fill="#f2f4f7" stroke="#cbd2dc"/><text x="46" y="440" font-size="21" font-weight="600" fill="#1c304d">mock 模式</text><text x="46" y="469" font-size="16" fill="#55657a">非默认真实模式</text><path d="M342,448 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="408" width="305" height="80" rx="12" fill="#f2f4f7" stroke="#cbd2dc"/><text x="393" y="440" font-size="21" font-weight="600" fill="#1c304d">本机演示服务</text><text x="393" y="469" font-size="16" fill="#55657a">收藏、意向、选人、C 发布</text><path d="M689,448 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="408" width="305" height="80" rx="12" fill="#f2f4f7" stroke="#cbd2dc"/><text x="740" y="440" font-size="21" font-weight="600" fill="#1c304d">localStorage</text><text x="740" y="469" font-size="16" fill="#55657a">不进入共享后端</text><text x="30" y="535" font-size="17" fill="#63738c">蓝：已存在的真实链路；灰：演示链路。图示依据原报告 S，不代表全链路运行验收。</text><text x="30" y="564" font-size="17" fill="#63738c">架构依据：原 §2、C05/C06、J01/J17/J22/J25。</text></svg>