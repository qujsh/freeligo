<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="483" viewBox="0 0 1080 483"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="483" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">核心链路｜公众只看确认发布的版本</text><text x="30" y="102" font-size="17" fill="#63738c">编辑阶段</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">收集需求</text><text x="46" y="179" font-size="16" fill="#55657a">输入主要留在 B 端内存</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">拆解 / 编辑工作项</text><text x="393" y="179" font-size="16" fill="#55657a">AI 结果可先独立入库</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">进入任务发布</text><text x="740" y="179" font-size="16" fill="#55657a">此时保存内部需求及关联</text><text x="30" y="247" font-size="17" fill="#63738c">发布阶段</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">保存发布草稿</text><text x="46" y="324" font-size="16" fill="#55657a">不改变已有正式内容</text><path d="M342,303 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">确认发布</text><text x="393" y="324" font-size="16" fill="#55657a">新增快照、更新当前版本指针</text><path d="M689,303 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">C 端浏览</text><text x="740" y="324" font-size="16" fill="#55657a">TASK 招募 + PROJECT 项目视角</text><text x="30" y="390" font-size="17" fill="#63738c">内部需求 ≠ 发布草稿 ≠ 正式快照；树节点不是独立可承接岗位。</text><text x="30" y="419" font-size="17" fill="#63738c">依据：原 §4.3/4.8/4.9、§5.1；B01/J17/J18/J23。</text></svg>