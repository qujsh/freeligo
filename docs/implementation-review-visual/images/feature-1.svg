<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="483" viewBox="0 0 1080 483"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="483" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">登录、账号与权限</text><text x="30" y="102" font-size="17" fill="#63738c">用户操作</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">B 手机号登录</text><text x="46" y="179" font-size="16" fill="#55657a">发送验证码并提交</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">建立会话</text><text x="393" y="179" font-size="16" fill="#55657a">Cookie；数据库保存令牌哈希</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">进入受保护功能</text><text x="740" y="179" font-size="16" fill="#55657a">每次认证查账号 / 会话</text><text x="30" y="247" font-size="17" fill="#63738c">权限分工（并列，分别判断）</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">平台角色</text><text x="46" y="324" font-size="16" fill="#55657a">控制账号与等级管理</text><rect x="377" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">业务身份</text><text x="393" y="324" font-size="16" fill="#55657a">发布者 / 承接者及等级</text><rect x="724" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">需求成员角色</text><text x="740" y="324" font-size="16" fill="#55657a">viewer / editor / manager / owner</text><text x="30" y="390" font-size="17" fill="#63738c">蓝：真实实现路径；灰：演示 / 内存交互；橙：未接入或关键限制。</text><text x="30" y="419" font-size="17" fill="#63738c">依据：原报告 §4.1、§4.2；详见本模块末尾技术依据。</text></svg>