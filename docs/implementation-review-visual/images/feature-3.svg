<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="628" viewBox="0 0 1080 628"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="628" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">AI 拆解与工作项编辑</text><text x="30" y="102" font-size="17" fill="#63738c">用户操作</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">准备 AI 分析内容</text><text x="46" y="179" font-size="16" fill="#55657a">复制提示词 / 外部交流 / 粘贴</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">提交拆解并等待</text><text x="393" y="179" font-size="16" fill="#55657a">202 返回任务号；轮询终态</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">编辑树与日期</text><text x="740" y="179" font-size="16" fill="#55657a">保存节点；甘特仅呈现日期</text><text x="30" y="247" font-size="17" fill="#63738c">后台作业</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">作业先入库</text><text x="46" y="324" font-size="16" fill="#55657a">queued → generating</text><path d="M342,303 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">生成与校验</text><text x="393" y="324" font-size="16" fill="#55657a">validating；固定四级结构</text><path d="M689,303 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">事务保存结果</text><text x="740" y="324" font-size="16" fill="#55657a">saving → success；失败留原因</text><text x="30" y="392" font-size="17" fill="#63738c">独立的简介链路</text><rect x="30" y="408" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="440" font-size="21" font-weight="600" fill="#1c304d">请求简介 SSE</text><text x="46" y="469" font-size="16" fill="#55657a">不是拆解作业轮询</text><path d="M342,448 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="408" width="305" height="80" rx="12" fill="#fff4e9" stroke="#e8b878"/><text x="393" y="440" font-size="21" font-weight="600" fill="#1c304d">已有简介直接复用</text><text x="393" y="469" font-size="16" fill="#55657a">特定标题后内容截去</text><path d="M689,448 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="408" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="440" font-size="21" font-weight="600" fill="#1c304d">前端流式呈现</text><text x="740" y="469" font-size="16" fill="#55657a">无 AI 分析时复制原始说明</text><text x="30" y="535" font-size="17" fill="#63738c">蓝：真实实现路径；灰：演示 / 内存交互；橙：未接入或关键限制。</text><text x="30" y="564" font-size="17" fill="#63738c">依据：原报告 §4.4、§4.5、§4.6；详见本模块末尾技术依据。</text></svg>