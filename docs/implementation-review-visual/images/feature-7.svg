<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="483" viewBox="0 0 1080 483"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="483" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">收藏、意向、承接与 C 发布</text><text x="30" y="102" font-size="17" fill="#63738c">真实模式</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">浏览正式任务</text><text x="46" y="179" font-size="16" fill="#55657a">公开 API 可用</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#fff4e9" stroke="#e8b878"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">点击收藏 / 意向 / 发布</text><text x="393" y="179" font-size="16" fill="#55657a">requireLogin 显示后续接入</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#fff4e9" stroke="#e8b878"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">不写共享数据库</text><text x="740" y="179" font-size="16" fill="#55657a">没有正式 C 写入链路</text><text x="30" y="247" font-size="17" fill="#63738c">仅 mock 演示</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#f2f4f7" stroke="#cbd2dc"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">演示用户操作</text><text x="46" y="324" font-size="16" fill="#55657a">收藏 / 意向 / C 发布</text><path d="M342,303 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="263" width="305" height="80" rx="12" fill="#f2f4f7" stroke="#cbd2dc"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">本机服务校验</text><text x="393" y="324" font-size="16" fill="#55657a">开放任务、非本人、非重复等</text><path d="M689,303 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="263" width="305" height="80" rx="12" fill="#f2f4f7" stroke="#cbd2dc"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">localStorage 更新</text><text x="740" y="324" font-size="16" fill="#55657a">选满人数关闭任务，不关项目</text><text x="30" y="390" font-size="17" fill="#63738c">蓝：真实实现路径；灰：演示 / 内存交互；橙：未接入或关键限制。</text><text x="30" y="419" font-size="17" fill="#63738c">依据：原报告 §4.13；详见本模块末尾技术依据。</text></svg>