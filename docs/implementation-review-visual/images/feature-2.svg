<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="483" viewBox="0 0 1080 483"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8292aa"/></marker></defs><rect width="1080" height="483" fill="#ffffff"/><text x="30" y="43" font-size="27" font-weight="650" fill="#17253c">需求创建与保存</text><text x="30" y="102" font-size="17" fill="#63738c">用户操作</text><rect x="30" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="150" font-size="21" font-weight="600" fill="#1c304d">新建 LOCAL 需求</text><text x="46" y="179" font-size="16" fill="#55657a">标题与说明留在组件 / App</text><path d="M342,158 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="150" font-size="21" font-weight="600" fill="#1c304d">点击任务发布</text><text x="393" y="179" font-size="16" fill="#55657a">触发 saveRequirement</text><path d="M689,158 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="118" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="150" font-size="21" font-weight="600" fill="#1c304d">获得 REQ 编号</text><text x="740" y="179" font-size="16" fill="#55657a">进入发布向导</text><text x="30" y="247" font-size="17" fill="#63738c">内部实现</text><rect x="30" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="46" y="295" font-size="21" font-weight="600" fill="#1c304d">POST requirements/save</text><text x="46" y="324" font-size="16" fill="#55657a">内容 + 当前 DEC + attachments</text><path d="M342,303 H368" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="377" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="393" y="295" font-size="21" font-weight="600" fill="#1c304d">授权与关联校验</text><text x="393" y="324" font-size="16" fill="#55657a">DEC 须成功且可访问</text><path d="M689,303 H715" stroke="#8292aa" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="263" width="305" height="80" rx="12" fill="#eef5ff" stroke="#aec9ef"/><text x="740" y="295" font-size="21" font-weight="600" fill="#1c304d">写 requirement</text><text x="740" y="324" font-size="16" fill="#55657a">附件描述整批替换</text><text x="30" y="390" font-size="17" fill="#63738c">蓝：真实实现路径；灰：演示 / 内存交互；橙：未接入或关键限制。</text><text x="30" y="419" font-size="17" fill="#63738c">依据：原报告 §4.3；详见本模块末尾技术依据。</text></svg>